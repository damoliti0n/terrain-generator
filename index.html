<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Terrain Generator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 10, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            max-width: 300px;
            color: #fff;
        }
        h2 {
            margin-top: 0;
            color: #00d2ff;
            font-size: 18px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #00d2ff;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #00d2ff;
        }
        .value-display {
            display: inline-block;
            float: right;
            color: #00d2ff;
            font-size: 12px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #004488;
            color: white;
            border: 1px solid #00d2ff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 15px #00d2ff;
        }
        #stopSound {
            border-color: #ff3366;
            color: #ff3366;
            background: rgba(255, 51, 102, 0.1);
        }
        #stopSound:hover {
            background: #ff3366;
            color: #fff;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00d2ff;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h2>Terrain Parameters</h2>
        
        <div class="control-group">
            <label>Scale (Frequency) <span class="value-display" id="scale-value">50</span></label>
            <input type="range" id="scale" min="10" max="200" value="50">
        </div>
        
        <div class="control-group">
            <label>Amplitude (Height) <span class="value-display" id="amplitude-value">15</span></label>
            <input type="range" id="amplitude" min="1" max="50" value="15">
        </div>
        
        <div class="control-group">
            <label>Octaves <span class="value-display" id="octaves-value">4</span></label>
            <input type="range" id="octaves" min="1" max="8" value="4">
        </div>
        
        <div class="control-group">
            <label>Persistence <span class="value-display" id="persistence-value">0.5</span></label>
            <input type="range" id="persistence" min="0.1" max="1" value="0.5" step="0.1">
        </div>

        <div class="control-group">
            <label>Seed <span class="value-display" id="seed-value">1234</span></label>
            <input type="range" id="seed" min="1" max="9999" value="1234">
        </div>
        
        <button id="regenerate">Regenerate Terrain</button>
        <button id="randomize">Randomize Parameters</button>
        
        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(0,210,255,0.3);">
            <h2>Audio Synthesis</h2>
            <button id="playSound">Play Terrain as Sound</button>
            <button id="stopSound">Stop Sound</button>
        </div>
    </div>
    
    <div id="info">Use mouse to rotate • Scroll to zoom • Drag to pan</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        class PerlinNoise {
            constructor(seed = 0) {
                this.seed = seed;
                this.p = this.buildPermutationTable();
            }
            buildPermutationTable() {
                const p = [];
                for (let i = 0; i < 256; i++) p[i] = i;
                let n = 256;
                while (n > 1) {
                    const k = Math.floor(this.seededRandom() * n--);
                    const temp = p[n]; p[n] = p[k]; p[k] = temp;
                }
                for (let i = 0; i < 256; i++) p[256 + i] = p[i];
                return p;
            }
            seededRandom() {
                const x = Math.sin(this.seed++) * 10000;
                return x - Math.floor(x);
            }
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 4 ? y : h === 12 || h === 14 ? x : 0;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            noise(x, y) {
                const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
                x -= Math.floor(x); y -= Math.floor(y);
                const u = this.fade(x), v = this.fade(y);
                const aa = this.p[this.p[X] + Y], ab = this.p[this.p[X] + Y + 1];
                const ba = this.p[this.p[X + 1] + Y], bb = this.p[this.p[X + 1] + Y + 1];
                return this.lerp(v, this.lerp(u, this.grad(aa, x, y), this.grad(ba, x - 1, y)),
                                   this.lerp(u, this.grad(ab, x, y - 1), this.grad(bb, x - 1, y - 1)));
            }
            octaveNoise(x, y, octaves, persistence) {
                let total = 0, frequency = 1, amplitude = 1, maxValue = 0;
                for (let i = 0; i < octaves; i++) {
                    total += this.noise(x * frequency, y * frequency) * amplitude;
                    maxValue += amplitude;
                    amplitude *= persistence; frequency *= 2;
                }
                return total / maxValue;
            }
        }

        let scene, camera, renderer, terrain, grid, noiseGen;
        const params = { scale: 50, amplitude: 15, octaves: 4, persistence: 0.5, seed: 1234 };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.Fog(0x000000, 50, 200);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 50, 80);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            scene.add(new THREE.AmbientLight(0x002244, 0.5));
            const dLight = new THREE.DirectionalLight(0x00d2ff, 1);
            dLight.position.set(50, 100, 50);
            scene.add(dLight);

            generateTerrain();
            setupControls();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function generateTerrain() {
            if (terrain) { scene.remove(terrain); scene.remove(grid); }
            
            noiseGen = new PerlinNoise(params.seed);
            const geometry = new THREE.PlaneGeometry(100, 100, 80, 80);
            const vertices = geometry.attributes.position.array;
            
            for (let i = 0; i < vertices.length; i += 3) {
                vertices[i + 2] = noiseGen.octaveNoise(
                    vertices[i] / params.scale, 
                    vertices[i + 1] / params.scale, 
                    params.octaves, 
                    params.persistence
                ) * params.amplitude;
            }
            
            geometry.computeVertexNormals();

            // Solid Terrain
            const material = new THREE.MeshPhongMaterial({
                color: 0x00081a,
                emissive: 0x001133,
                flatShading: true
            });
            terrain = new THREE.Mesh(geometry, material);
            terrain.rotation.x = -Math.PI / 2;
            scene.add(terrain);

            // Grid Layer
            const wireframe = new THREE.WireframeGeometry(geometry);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x00d2ff, transparent: true, opacity: 0.4 });
            grid = new THREE.LineSegments(wireframe, lineMat);
            grid.rotation.x = -Math.PI / 2;
            grid.position.y = 0.05; // Slightly offset to prevent flickering
            scene.add(grid);
        }

        function setupControls() {
            let isDragging = false, prevMouse = { x: 0, y: 0 };
            renderer.domElement.addEventListener('mousedown', () => isDragging = true);
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    camera.position.x -= (e.offsetX - prevMouse.x) * 0.1;
                    camera.position.z -= (e.offsetY - prevMouse.y) * 0.1;
                }
                prevMouse = { x: e.offsetX, y: e.offsetY };
            });
            renderer.domElement.addEventListener('mouseup', () => isDragging = false);
            renderer.domElement.addEventListener('wheel', (e) => {
                camera.position.y += e.deltaY * 0.05;
                camera.position.y = Math.max(10, Math.min(200, camera.position.y));
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if(terrain) {
                terrain.rotation.z += 0.001;
                grid.rotation.z += 0.001;
            }
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // UI Listeners
        const inputs = ['scale', 'amplitude', 'octaves', 'persistence', 'seed'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                params[id] = parseFloat(e.target.value);
                document.getElementById(`${id}-value`).textContent = e.target.value;
            });
        });

        document.getElementById('regenerate').addEventListener('click', generateTerrain);
        document.getElementById('randomize').addEventListener('click', () => {
            params.seed = Math.floor(Math.random() * 9999);
            document.getElementById('seed').value = params.seed;
            document.getElementById('seed-value').textContent = params.seed;
            generateTerrain();
        });

        init();
    </script>
</body>
</html>
