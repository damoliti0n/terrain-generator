<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Terrain Generator</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #1a1a2e;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    #canvas-container {
        flex: 1;
        height: 100%;
        transition: all 0.3s ease;
    }

    /* Sidebar */
    #controls {
        width: 320px;
        background: rgba(255,255,255,0.95);
        padding: 20px;
        box-shadow: -4px 0 6px rgba(0,0,0,0.3);
        overflow-y: auto;
        transition: transform 0.3s ease;
    }

    /* Hidden state */
    #controls.collapsed {
        transform: translateX(100%);
    }

    /* Toggle button */
    #toggleBtn {
        position: absolute;
        top: 20px;
        right: 340px;
        z-index: 10;
        padding: 8px 12px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: right 0.3s ease;
    }

    #toggleBtn.collapsed {
        right: 20px;
    }

    h2 {
        margin-top: 0;
        color: #1a1a2e;
    }

    .control-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: bold;
    }

    input[type="range"] {
        width: 100%;
    }

    .value-display {
        float: right;
        font-size: 12px;
        color: #666;
    }

    button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    #info {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: white;
        background: rgba(0,0,0,0.7);
        padding: 10px;
        border-radius: 4px;
        font-size: 12px;
    }
</style>
</head>

<body>

<div id="canvas-container"></div>

<button id="toggleBtn">Hide UI</button>

<div id="controls">
    <h2>Terrain Parameters</h2>

    <div class="control-group">
        <label>Scale <span id="scale-value" class="value-display">50</span></label>
        <input type="range" id="scale" min="10" max="200" value="50">
    </div>

    <div class="control-group">
        <label>Amplitude <span id="amplitude-value" class="value-display">15</span></label>
        <input type="range" id="amplitude" min="1" max="50" value="15">
    </div>

    <button id="regenerate">Regenerate</button>
</div>

<div id="info">Use mouse to rotate • Scroll to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
let scene, camera, renderer, terrain;

function init(){
    const container = document.getElementById("canvas-container");

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, container.clientWidth/container.clientHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer();
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    camera.position.set(0,50,80);

    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(50,100,50);
    scene.add(light);

    generateTerrain();

    window.addEventListener("resize", resize);
    animate();
}

function generateTerrain(){
    if(terrain) scene.remove(terrain);

    const geo = new THREE.PlaneGeometry(100,100,50,50);
    const mat = new THREE.MeshStandardMaterial({color:0x88aa88});
    terrain = new THREE.Mesh(geo,mat);
    terrain.rotation.x = -Math.PI/2;

    scene.add(terrain);
}

function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}

function resize(){
    const container = document.getElementById("canvas-container");
    camera.aspect = container.clientWidth/container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
}

init();

/* ===== COLLAPSE LOGIC ===== */
const controls = document.getElementById("controls");
const toggleBtn = document.getElementById("toggleBtn");

toggleBtn.addEventListener("click", () => {
    controls.classList.toggle("collapsed");
    toggleBtn.classList.toggle("collapsed");

    toggleBtn.textContent = controls.classList.contains("collapsed")
        ? "Show UI"
        : "Hide UI";

    setTimeout(resize, 300); // wait for animation
});

</script>

</body>
</html>
